services:
  web:
    build: .
    # Runs the factory app from run.py using Gunicorn
    command: gunicorn --bind 0.0.0.0:8000 run:app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://nerds_user:nerds_pass@db:5432/nerds_db
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
