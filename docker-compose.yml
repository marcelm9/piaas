version: '3.8'

services:
  web:
    build: .
    # Runs the factory app from run.py using Gunicorn
    command: gunicorn --bind 0.0.0.0:8000 run:app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://nerds_user:nerds_pass@db:5432/nerds_db
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=nerds_user
      - POSTGRES_PASSWORD=nerds_pass
      - POSTGRES_DB=nerds_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: