version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Connects to the database service defined below
      - DATABASE_URL=postgresql://nerds_user:nerds_pass@db:5432/nerds_db
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=nerds_user
      - POSTGRES_PASSWORD=nerds_pass
      - POSTGRES_DB=nerds_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
